[package]
name = "imgscale"
version = "0.1.0"
description = "A library for generating various sizes of an image and the appropriate html <img> tag"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
default = []
clap = ["dep:clap"] # Implement clap traits
zenwebp-agpl = ["dep:zenwebp"] # Use zenwebp as webp-backend (Note: `AGPL-3.0-only` licensed)

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
thiserror = "2"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "avif",
] }
zenwebp = { version = "0.4", optional = true }
