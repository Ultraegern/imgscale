[package]
name = "imgscale"
version = "0.1.0"
description = "A library for generating multiple sizes of images for web development"
edition = "2024"

[features]
default = []
clap = ["dep:clap"] # Implement clap traits

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
thiserror = "2"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "avif",
] }
