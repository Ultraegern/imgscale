[package]
name = "imgscale"
version = "0.1.0"
description = "A utility for generating multiple sizes of images for web development"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "avif",
] }
